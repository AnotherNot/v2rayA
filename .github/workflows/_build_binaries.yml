name: Build v2rayA Binaries (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the build"
        type: string
        required: true

jobs:
  Build_v2rayA_Binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # Linux, other architectures
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          # Linux armv7
          - { goos: linux, goarch: arm, goarm: "7" }
          # Windows
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # macOS
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          # FreeBSD (no TUN)
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          # OpenBSD (no TUN)
          - { goos: openbsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }
    env:
      CGO_ENABLED: 0
      VERSION: ${{ inputs.version }}
      NAME: v2raya
      DESC: "A web GUI client of Project V which supports VMess, VLESS, Shadowsocks, Trojan, TUIC, Juicity and AnyTLSs"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download Web Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            service/go.mod
            service/go.sum
          go-version: "1.27"
      - name: Build v2rayA Binary
        id: build_binary
        shell: bash
        run: |
          mkdir -p v2raya_binaries
          key="${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}"
          filename=$(jq -r --arg key "$key" '.[$key].friendlyName' ./install/friendly-filenames.json)
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          cgo_enabled=0
          cd service
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" GOARM="${{ matrix.goarm }}" \
            CGO_ENABLED="$cgo_enabled" \
            go build -trimpath \
            -o ../v2raya_binaries/v2raya_${filename}_${VERSION}${ext} \
            -ldflags="-X github.com/v2rayA/v2rayA/conf.Version=${VERSION} -s -w" \
            -trimpath
          echo "filename=v2raya_${filename}_${VERSION}${ext}" >> ${GITHUB_OUTPUT}
      - name: Build v2rayA Core Binary
        id: build_core_binary
        shell: bash
        run: |
          mkdir -p v2raya_binaries
          key="${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}"
          filename=$(jq -r --arg key "$key" '.[$key].friendlyName' ./install/friendly-filenames.json)
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          cd core
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" GOARM="${{ matrix.goarm }}" \
            go build -trimpath \
            -o ../v2raya_binaries/v2raya_core_${filename}_${VERSION}${ext} \
            -ldflags="-X main.Version=${VERSION} -s -w" \
            -trimpath \
            ./main
          echo "filename=v2raya_core_${filename}_${VERSION}${ext}" >> ${GITHUB_OUTPUT}
      - name: Upload v2rayA Binary Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build_binary.outputs.filename }}
          path: v2raya_binaries/${{ steps.build_binary.outputs.filename }}
      - name: Upload v2rayA Core Binary Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build_core_binary.outputs.filename }}
          path: v2raya_binaries/${{ steps.build_core_binary.outputs.filename }}

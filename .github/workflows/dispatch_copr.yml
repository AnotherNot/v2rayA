name: dispatch_copr

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "gui/**"
      - ".github/workflows/*.yml"

jobs:
  call_copr:
    runs-on: ubuntu-latest
    steps:
      - name: curl
        env:
          COPR_HOOK_URL: ${{ secrets.COPR_HOOK_URL }}
        run: |
          curl -fsS -X POST "$COPR_HOOK_URL"

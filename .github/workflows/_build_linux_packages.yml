name: Build Linux Packages (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the packages"
        type: string
        required: true

permissions:
  contents: read

env:
  # Pinned rule data: a package rebuilt from the same commit must carry the
  # same rules. The service refreshes its own copy at runtime and checks the
  # sha256sum published next to the download, so a pinned build is not a
  # frozen install.
  RULES_TAG: "202611102204"
  GEOIP_SHA256: "90b78ab861c1cdc3f871f305f9ceedfb8d6d6329e3a40295e6773e057297384c"
  GEOSITE_SHA256: "22bfa33ed2b511ad246dfed7114bfa92ae258fce2ede6a24e7320439103da3b4"
  NFPM_VERSION: "2.48.0"

jobs:
  # The default configuration is generated by running the amd64 binary and is
  # the same for every architecture; doing it once keeps a copy of the binary
  # out of each package matrix entry.
  default-config:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the amd64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries-linux_x64
      - name: Generate the default configuration
        shell: bash
        env:
          V2RAYA_CONFIG: ${{ runner.temp }}/v2raya-config
        run: |
          mkdir -p unpacked
          tar -xzf v2raya_linux_x64_"$VERSION".tar.gz -C unpacked
          chmod 755 unpacked/v2raya
          {
            printf '%s\n' \
              '# v2raya config example' \
              '# Everything has defaults so you only need to uncomment things you want to' \
              '# change' \
              ''
            # --report config prints the build metadata first; the configuration
            # dump starts at the first comment line.
            ./unpacked/v2raya --report config |
              sed -n '/^# /,$p' |
              fold -s -w 78 |
              sed -E 's/^([^#].+)/# \1/'
          } > v2raya.default
          # A report that came back empty would otherwise ship an empty file.
          test "$(grep -c '^# V2RAYA_' v2raya.default)" -ge 5
          cat v2raya.default
      - name: Upload the default configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: default-config
          path: v2raya.default
          retention-days: 1

  packages:
    needs: default-config
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nfpm writes the architecture into the package metadata verbatim,
          # and each format names it differently.
          - { friendly: x64, artifact: linux_x64, deb_arch: amd64, rpm_arch: x86_64, archlinux_arch: x86_64, apk_arch: x86_64 }
          - { friendly: arm64, artifact: linux_arm64, deb_arch: arm64, rpm_arch: aarch64, archlinux_arch: aarch64, apk_arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries-${{ matrix.artifact }}
      - name: Download the default configuration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: default-config
      - name: Unpack the binaries
        shell: bash
        run: |
          mkdir -p pkg
          tar -xzf v2raya_${{ matrix.artifact }}_"$VERSION".tar.gz -C pkg
          chmod 755 pkg/v2raya pkg/v2raya_core
          install -m 644 v2raya.default install/universal/v2raya.default
      - name: Download the pinned rule data
        shell: bash
        run: |
          base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$RULES_TAG"
          curl -fsSL -o pkg/geoip.dat "$base/geoip.dat"
          curl -fsSL -o pkg/geosite.dat "$base/geosite.dat"
          echo "$GEOIP_SHA256  pkg/geoip.dat" | sha256sum -c -
          echo "$GEOSITE_SHA256  pkg/geosite.dat" | sha256sum -c -
          chmod 644 pkg/geoip.dat pkg/geosite.dat
      - name: Install nfpm
        shell: bash
        run: |
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          sudo tar -xzf nfpm.tar.gz -C /usr/local/bin nfpm
          rm nfpm.tar.gz
          nfpm --version
      - name: Build the packages
        shell: bash
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          ARCHLINUX_ARCH: ${{ matrix.archlinux_arch }}
          APK_ARCH: ${{ matrix.apk_arch }}
        run: |
          # nfpm's config carries the arch and version as environment
          # references; render them explicitly so the value each packager
          # writes is the one in the matrix, not an implicit mapping.
          mkdir -p packages
          for package_manager in deb rpm archlinux apk; do
            case $package_manager in
              deb) package_arch=$DEB_ARCH; package_distro=debian; package_ext=deb ;;
              rpm) package_arch=$RPM_ARCH; package_distro=redhat; package_ext=rpm ;;
              archlinux) package_arch=$ARCHLINUX_ARCH; package_distro=archlinux; package_ext=pkg.tar.zst ;;
              apk) package_arch=$APK_ARCH; package_distro=alpine; package_ext=apk ;;
            esac
            # envsubst wants the literal references; the shell must not
            # expand them.
            # shellcheck disable=SC2016
            PACKAGE_ARCH=$package_arch PACKAGE_VERSION=$VERSION \
              envsubst '${PACKAGE_ARCH} ${PACKAGE_VERSION}' \
              < install/nfpm/v2raya.yaml > nfpm.yaml
            nfpm package -f nfpm.yaml -p "$package_manager" \
              -t "packages/installer_${package_distro}_${{ matrix.friendly }}_${VERSION}.${package_ext}"
          done
          ls -l packages
      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-linux-${{ matrix.friendly }}
          path: packages/*
          if-no-files-found: error
          retention-days: 1

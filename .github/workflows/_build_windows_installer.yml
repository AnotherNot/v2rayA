name: Build Windows Installer (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the installer"
        type: string
        required: true

permissions:
  contents: read

env:
  # Pinned rule data, as in the Linux packages; the service refreshes its copy
  # at runtime.
  RULES_TAG: "202611102204"
  GEOIP_SHA256: "90b78ab861c1cdc3f871f305f9ceedfb8d6d6329e3a40295e6773e057297384c"
  GEOSITE_SHA256: "22bfa33ed2b511ad246dfed7114bfa92ae258fce2ede6a24e7320439103da3b4"
  WINTUN_URL: "https://www.wintun.net/builds/wintun-0.14.1.zip"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  Build_Windows_Installer:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # innoarch is the name Inno Setup knows the architecture by; the
          # installer asset keeps the shorter x64/arm64 suffix the release has
          # always used.
          - { asset_arch: x64, archive: windows_x64, innoarch: x64compatible, wintun_arch: amd64 }
          - { asset_arch: arm64, archive: windows_arm64, innoarch: arm64, wintun_arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries-${{ matrix.archive }}
          path: D:\Downloads
      - name: Unpack the binaries
        shell: pwsh
        run: |
          Expand-Archive -Path "D:\Downloads\v2raya_${{ matrix.archive }}_$env:VERSION.zip" `
            -DestinationPath "D:\Downloads\unpacked" -Force
      - name: Download Wintun
        shell: pwsh
        run: |
          # The core loads wintun.dll from its own directory; the driver
          # package is the official one, pinned by hash.
          Invoke-WebRequest $env:WINTUN_URL -OutFile "D:\wintun.zip"
          $hash = (Get-FileHash -Path "D:\wintun.zip" -Algorithm SHA256).Hash
          if ($hash -ne $env:WINTUN_SHA256) {
            throw "SHA256 hash mismatch for Wintun. Expected: $env:WINTUN_SHA256, Actual: $hash"
          }
          Expand-Archive -Path "D:\wintun.zip" -DestinationPath "D:\wintun"
      - name: Download the pinned rule data
        shell: pwsh
        run: |
          $base = "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$env:RULES_TAG"
          $files = @(
            @{ Name = "geoip.dat"; Hash = $env:GEOIP_SHA256 },
            @{ Name = "geosite.dat"; Hash = $env:GEOSITE_SHA256 }
          )
          foreach ($file in $files) {
            Invoke-WebRequest "$base/$($file.Name)" -OutFile "D:\$($file.Name)"
            $actual = (Get-FileHash -Path "D:\$($file.Name)" -Algorithm SHA256).Hash
            if ($actual -ne $file.Hash) {
              throw "SHA256 hash mismatch for $($file.Name). Expected: $($file.Hash), Actual: $actual"
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
      - name: Build Windows Installer
        shell: pwsh
        run: |
          $workspace = Get-Location
          $root = "D:\v2raya-${{ matrix.innoarch }}-windows"
          New-Item -ItemType Directory -Path "$root\bin", "$root\data" -Force | Out-Null
          Copy-Item -Path "D:\Downloads\unpacked\v2raya.exe" -Destination "$root\bin\v2raya.exe"
          Copy-Item -Path "D:\Downloads\unpacked\v2raya_core.exe" -Destination "$root\bin\v2raya_core.exe"
          Copy-Item -Path "D:\wintun\wintun\bin\${{ matrix.wintun_arch }}\wintun.dll" -Destination "$root\bin\wintun.dll"
          Copy-Item -Path "D:\geoip.dat", "D:\geosite.dat" -Destination "$root\data\"
          # Keep the legacy alias some rules reference as
          # ext:"LoyalsoldierSite.dat:...".
          Copy-Item -Path "D:\geosite.dat" -Destination "$root\data\LoyalsoldierSite.dat"
          Copy-Item -Path ".\install\windows-inno\v2raya.ico" -Destination "D:\v2raya.ico"
          Copy-Item -Path ".\LICENSE" -Destination "D:\LICENSE.txt"
          Copy-Item -Path ".\install\windows-inno\ChineseSimplified.isl" -Destination "D:\ChineseSimplified.isl"
          $iss = Get-Content -Path .\install\windows-inno\windows.iss -Raw
          $iss = $iss.Replace("TheRealVersion", $env:VERSION).Replace("TheRealArch", "${{ matrix.innoarch }}")
          # Inno Setup reads a script without a BOM as ANSI on older 6.x
          # builds; the script carries Chinese comments, so write it as UTF-8
          # with a BOM.
          Set-Content -NoNewline -Encoding utf8BOM -Path "D:\windows_${{ matrix.asset_arch }}.iss" -Value $iss
          Set-Location -Path "D:\"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "D:\windows_${{ matrix.asset_arch }}.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }
          Set-Location -Path $workspace
          Copy-Item -Path "D:\installer_windows_inno_${{ matrix.innoarch }}.exe" `
            -Destination "installer_windows_inno_${{ matrix.asset_arch }}_$env:VERSION.exe"
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-windows-${{ matrix.asset_arch }}
          path: installer_windows_inno_${{ matrix.asset_arch }}_${{ inputs.version }}.exe
          if-no-files-found: error
          retention-days: 1

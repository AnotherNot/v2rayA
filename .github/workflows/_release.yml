name: Release v2rayA (Reusable)

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: boolean
        required: true
      publish_downstream:
        type: boolean
        required: true

jobs:
  Build_v2rayA_Web:
    uses: ./.github/workflows/_build_web.yml
    with:
      upload_archive: true

  Compute_Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.VERSION }}
    steps:
      - name: Compute Version
        id: prep
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT

  Build_v2rayA_Binaries:
    needs: [Build_v2rayA_Web, Compute_Version]
    uses: ./.github/workflows/_build_binaries.yml
    with:
      version: ${{ needs.Compute_Version.outputs.version }}

  Build_Windows_Installers:
    needs: [Build_v2rayA_Binaries, Compute_Version]
    uses: ./.github/workflows/_build_windows_installer.yml
    with:
      version: ${{ needs.Compute_Version.outputs.version }}

  Build_Linux_Packages:
    needs: [Build_v2rayA_Binaries, Compute_Version]
    uses: ./.github/workflows/_build_linux_packages.yml
    with:
      version: ${{ needs.Compute_Version.outputs.version }}

  GitHub_Release:
    runs-on: ubuntu-latest
    needs: [Build_v2rayA_Binaries, Build_Windows_Installers, Build_Linux_Packages]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: builds/
      - name: Move Files to Release Directory
        shell: bash
        run: |
          mkdir -p release
          for file in $(ls builds | grep -E "^installer|^v2raya"); do
            mv builds/$file/$file release/
          done
          mv builds/web.tar.gz/web.tar.gz release/
          for file in $(ls release); do
            sha256sum release/$file | awk '{print $1}' > release/$file.sha256.txt
          done
          ls -l release/
      - name: Compress Web Files
        shell: pwsh
        run: |
          Compress-Archive -Path ./builds/web/* -DestinationPath ./web.zip
          ((Get-FileHash ./web.zip).hash).ToLower() > web.zip.sha256.txt
          Move-Item ./web.zip ./release/web.zip
          Move-Item ./web.zip.sha256.txt ./release/web.zip.sha256.txt
      - name: Upload Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Latest_Releases=$(curl -s -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          Latest_tag=v${{ steps.prep.outputs.VERSION }}
          if [ "$Latest_Releases" != "$Latest_tag" ]; then
            prerelease=()
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              prerelease+=(--prerelease)
            fi
            gh release create "v${{ steps.prep.outputs.VERSION }}" -t "v${{ steps.prep.outputs.VERSION }}" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "v${{ steps.prep.outputs.VERSION }}" release/*

  Release_v2rayA_to_Docker:
    if: inputs.publish_downstream
    runs-on: ubuntu-latest
    needs: [GitHub_Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
          echo tag=${{ inputs.tag }} >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert repository owner to lowercase
        run: |
          echo "LOWERCASE_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: install/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.prep.outputs.VERSION }}
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPOSITORY_OWNER }}/v2rayb:${{ steps.prep.outputs.tag }}
            ghcr.io/${{ env.LOWERCASE_REPOSITORY_OWNER }}/v2rayb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Release_v2rayA_GUI_to_Docker:
    if: inputs.publish_downstream
    runs-on: ubuntu-latest
    needs: [Build_v2rayA_Web]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download Web Files
        uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert repository owner to lowercase
        run: |
          echo "LOWERCASE_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: install/docker/Dockerfile.GUI.Action
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPOSITORY_OWNER }}/v2rayb-gui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Submit_to_Microsoft_winget:
    if: inputs.publish_downstream
    runs-on: windows-latest
    needs: [GitHub_Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        shell: bash
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Submit to Microsoft winget
        shell: pwsh
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $Installer_x64_url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.prep.outputs.VERSION }}/installer_windows_inno_x64_${{ steps.prep.outputs.VERSION }}.exe"
          $Installer_ARM64_url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.prep.outputs.VERSION }}/installer_windows_inno_arm64_${{ steps.prep.outputs.VERSION }}.exe"
          # update submits a version bump for the fork's own package id; the
          # very first release has no manifest yet, so fall back to creating
          # it.
          ./wingetcreate.exe update AnotherNot.v2rayB --urls $Installer_x64_url $Installer_ARM64_url --version ${{ steps.prep.outputs.VERSION }} --token $env:RELEASE_PAT --submit
          if ($LASTEXITCODE -ne 0) {
            ./wingetcreate.exe new $Installer_x64_url $Installer_ARM64_url `
              --package-identifier AnotherNot.v2rayB `
              --package-name "v2rayB" --publisher "AnotherNot" `
              --package-url "https://github.com/${{ github.repository }}" `
              --license "GPL-3.0-only" `
              --description "A web client for its own Xray-based core with global transparent proxy." `
              --version ${{ steps.prep.outputs.VERSION }} `
              --token $env:RELEASE_PAT --submit
          }

  Release_to_Scoop:
    if: inputs.publish_downstream
    runs-on: ubuntu-latest
    needs: [GitHub_Release]
    steps:
      - name: Check Version
        id: prep
        run: |
          version=$(echo '${{ inputs.tag }}' | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
      - name: Download Windows installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer_windows_inno_*_${{ steps.prep.outputs.VERSION }}.exe
          merge-multiple: true
          path: installers
      - name: Push the manifest to the bucket
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          version=${{ steps.prep.outputs.VERSION }}
          x64_hash=$(sha256sum installers/installer_windows_inno_x64_${version}.exe | awk '{print $1}')
          arm64_hash=$(sha256sum installers/installer_windows_inno_arm64_${version}.exe | awk '{print $1}')
          rm -rf bucket && git clone "https://x-access-token:${RELEASE_PAT}@github.com/AnotherNot/scoop-v2rayb.git" bucket
          mkdir -p bucket/bucket
          python3 - <<EOF
          import json
          m = json.load(open("install/scoop/v2rayb.json"))
          m["version"] = "${version}"
          for arch, name, digest in (
              ("64bit", "x64", "${x64_hash}"),
              ("arm64", "arm64", "${arm64_hash}"),
          ):
              entry = m["architecture"][arch]
              entry["url"] = entry["url"].replace("0.0.0", "${version}")
              entry["hash"] = "sha256:" + digest
          json.dump(m, open("bucket/bucket/v2rayb.json", "w"), indent=2, ensure_ascii=False)
          open("bucket/bucket/v2rayb.json", "a").write("\n")
          EOF
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/v2rayb.json
          git commit -m "v2rayb ${version}" || echo "manifest unchanged"
          git push

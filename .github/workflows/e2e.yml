name: Browser End-to-End

on:
  pull_request:
    paths:
      - "gui/**"
      - "service/**"
      - "core/**"
      - "build.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: gui/yarn.lock
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: |
            service/go.mod
            service/go.sum
      - name: Install the interface dependencies
        run: yarn --cwd gui install --frozen-lockfile
      - name: Build the interface and the service
        run: ./build.sh
      - name: Install Chromium
        run: yarn --cwd gui playwright install --with-deps chromium
      - name: Run the browser tests
        run: yarn --cwd gui test:e2e
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            gui/playwright-report
            gui/test-results
          retention-days: 7

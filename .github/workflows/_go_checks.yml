name: Go Checks (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Web Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            service/go.mod
            service/go.sum
          go-version: "1.27"
      # The service embeds the built web files, so the embed target must be
      # populated before the module compiles at all.
      - name: Vet
        shell: bash
        run: |
          cd service && go vet ./...
          cd ../core && go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Web Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            service/go.mod
            service/go.sum
          go-version: "1.27"
      # The runner is not root, so the service comes up in lite mode and the
      # tests that need the transparent-proxy paths skip themselves.
      - name: Test
        shell: bash
        run: cd service && go test -race -timeout 20m ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Web Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            service/go.mod
            service/go.sum
          go-version: "1.27"
      # Pinned like the actions: a scanner that changes silently cannot be
      # trusted to keep a gate green.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan the service
        working-directory: service
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: Scan the core
        working-directory: core
        run: $(go env GOPATH)/bin/govulncheck ./...

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Refuse private keys in the tree
        run: ./install/security/check-private-keys.sh

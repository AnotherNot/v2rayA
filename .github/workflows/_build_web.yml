name: Build v2rayA Web (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  Build_v2rayA_Web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: gui/yarn.lock
      # The release build must come from the committed lockfile, exactly as
      # the GUI check does; --check-files would let a drifted lockfile pass.
      - name: Build GUI
        run: |
          yarn --cwd gui install --frozen-lockfile
          yarn --cwd gui build
      # The web artifact is consumed within the same run and never published
      # on its own, so it does not need the default retention.
      - name: Upload Web Files to Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: web/*
          name: web
          retention-days: 1

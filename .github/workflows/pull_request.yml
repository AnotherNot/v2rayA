name: Pull Request Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "service/**"
      - "core/**"
      - "gui/**"
      - "install/**"
      - "build.sh"
      - "build-all.sh"
      - "build.ps1"
      - ".github/workflows/*.yml"

# A new push to a pull request makes the previous run irrelevant.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build_v2rayA_Web:
    uses: ./.github/workflows/_build_web.yml

  Go_Checks:
    needs: Build_v2rayA_Web
    uses: ./.github/workflows/_go_checks.yml

  # The release compiles four targets. Cross-compiling them here on one runner
  # proves the same thing a native runner would, without the macOS queue and
  # without publishing hundreds of megabytes of throwaway binaries.
  Build_v2rayA:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: Build_v2rayA_Web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            service/go.mod
            service/go.sum
            core/go.mod
            core/go.sum
          go-version: "1.27"
      - name: Build v2rayA
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="unstable-$(git log -1 --format=%cd --date=short | sed s/-//g).r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          # Nothing is published from a pull request: the build only has to
          # prove the target compiles.
          (cd service && CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X github.com/v2rayA/v2rayA/conf.Version=$version -s -w" \
            -o /dev/null .)
          (cd core && CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X main.Version=$version -s -w" \
            -o /dev/null ./main)

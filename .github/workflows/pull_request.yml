name: Pull Request Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "service/**"
      - "core/**"
      - "gui/**"
      - ".github/workflows/*.yml"
jobs:
  Build_v2rayA_Web:
    uses: ./.github/workflows/_build_web.yml

  Go_Checks:
    needs: Build_v2rayA_Web
    uses: ./.github/workflows/_go_checks.yml

  Build_v2rayA:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goarch: amd64 }
          - { os: ubuntu-latest, goarch: arm64 }
          - { os: windows-latest, goarch: amd64 }
          - { os: windows-latest, goarch: arm64 }
          - { os: macos-latest, goarch: amd64 }
          - { os: macos-latest, goarch: arm64 }
    needs: Build_v2rayA_Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            service/go.mod
            service/go.sum
          go-version: "1.27"
      - name: Build v2rayA
        shell: bash
        run: |
          mkdir v2raya_bin
          CurrentDir="$(pwd)"
          date=$(git -C "$CurrentDir" log -1 --format="%cd" --date=short | sed s/-//g)
          count=$(git -C "$CurrentDir" rev-list --count HEAD)
          commit=$(git -C "$CurrentDir" rev-parse --short HEAD)
          version="unstable-$date.r${count}.$commit"
          case "${{ matrix.os }}" in
            windows-latest) os="windows"; ext=".exe" ;;
            macos-latest)   os="darwin";  ext="" ;;
            ubuntu-latest)  os="linux";   ext="" ;;
          esac
          cd "$CurrentDir"/service
          GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X github.com/v2rayA/v2rayA/conf.Version=$version -s -w" \
            -o "$CurrentDir/v2raya_bin/v2raya_pr_build_${os}_${{ matrix.goarch }}_${version}${ext}"
          cd "$CurrentDir"/core
          GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X main.Version=$version -s -w" \
            -o "$CurrentDir/v2raya_bin/v2raya_core_pr_build_${os}_${{ matrix.goarch }}_${version}${ext}" ./main
      - name: Upload v2rayA Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: v2raya_pr_build_${{ matrix.os }}_${{ matrix.goarch }}
          path: v2raya_bin/v2raya*

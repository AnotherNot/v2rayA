name: Release Binaries & Images

# Manual release, the only release path of this fork. One run builds the
# interface, then the service and its core for Linux and Windows on amd64 and
# arm64, packs each pair into an archive, turns the Linux archives into
# deb/rpm/apk/Arch packages and the Windows ones into Inno Setup installers,
# pushes the multi-arch container image to GHCR, and publishes the archives,
# the packages, the installers and one SHA256SUMS as a GitHub release. The tag
# is created at the commit the run was started from.
#
# `dry_run` builds and verifies all of it without creating the tag, publishing
# the release or pushing the image. Use it to validate a change to this
# workflow; the intermediate artifacts expire on their own.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v2.5.14"
        type: string
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        required: false
        default: false

run-name: Release ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag and compute the version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)*$ ]]; then
            echo "::error::tag '$TAG' does not look like v2.5.14"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG as version $version"

  web:
    uses: ./.github/workflows/_build_web.yml

  build:
    needs: [prepare, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, friendly: linux_x64 }
          - { goos: linux, goarch: arm64, friendly: linux_arm64 }
          - { goos: windows, goarch: amd64, friendly: windows_x64 }
          - { goos: windows, goarch: arm64, friendly: windows_arm64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download Web Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: service/server/router/web
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            service/go.mod
            service/go.sum
          go-version: "1.27"
      - name: Build and pack the binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p stage dist
          (cd service && CGO_ENABLED=0 go build -trimpath \
            -o "../stage/v2raya${ext}" \
            -ldflags="-X github.com/v2rayA/v2rayA/conf.Version=${VERSION} -s -w" \
            .)
          (cd core && CGO_ENABLED=0 go build -trimpath \
            -o "../stage/v2raya_core${ext}" \
            -ldflags="-X main.Version=${VERSION} -s -w" \
            ./main)
          cp LICENSE stage/
          if [ "$GOOS" = windows ]; then
            (cd stage && zip -q -r "../dist/v2raya_${{ matrix.friendly }}_${VERSION}.zip" .)
          else
            tar -czf "dist/v2raya_${{ matrix.friendly }}_${VERSION}.tar.gz" -C stage .
          fi
          # The archive is the release asset. The bare binaries are only an
          # intermediate and are deliberately not uploaded or published.
          rm -rf stage
          ls -l dist
      - name: Check the archive and run the host binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        env:
          V2RAYA_CONFIG: ${{ runner.temp }}/v2raya-smoke
        run: |
          archive=$(ls dist/v2raya_*.tar.gz)
          # grep -q would close the pipe early and tar would fail on SIGPIPE
          # under the runner's `set -o pipefail`.
          listing=$(tar -tzf "$archive")
          grep -qx './v2raya' <<<"$listing"
          grep -qx './v2raya_core' <<<"$listing"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked"
          report=$("$RUNNER_TEMP/unpacked/v2raya" --report config)
          grep -qx "Version: ${VERSION}" <<<"$report"
          "$RUNNER_TEMP/unpacked/v2raya_core" --version
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries-${{ matrix.friendly }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  linux-packages:
    needs: [prepare, build]
    uses: ./.github/workflows/_build_linux_packages.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  windows-installer:
    needs: [prepare, build]
    uses: ./.github/workflows/_build_windows_installer.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Docker tags are lowercase, while the owner name is not.
      - name: Name the image
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect the tags
        id: tags
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:${VERSION}"
            [ "$PRERELEASE" = "true" ] || echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: install/docker/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          # A dry run still proves the Dockerfile builds for both platforms;
          # it only skips the registry write.
          push: ${{ !inputs.dry_run }}
          provenance: ${{ !inputs.dry_run }}
          sbom: ${{ !inputs.dry_run }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, build, linux-packages, windows-installer, image]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "binaries-*"
          path: dist
          merge-multiple: true
      - name: Download the packages and installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "installer-*"
          path: dist
          merge-multiple: true
      # A tag that already exists must be the one being released; otherwise
      # the release would silently point at a different commit.
      - name: Check the tag
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_commit=$(git rev-parse "$TAG^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already points at $tag_commit, not at $GITHUB_SHA"
              exit 1
            fi
          fi
      - name: Check the asset list
        shell: bash
        run: |
          # Archives, distribution packages and installers are the release
          # assets; a bare binary here means the build job leaked its
          # intermediate, which duplicates the archive byte for byte.
          unexpected=$(find dist -maxdepth 1 -type f \
            ! -name '*.tar.gz' ! -name '*.zip' \
            ! -name '*.deb' ! -name '*.rpm' ! -name '*.pkg.tar.zst' ! -name '*.apk' \
            ! -name '*.exe')
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected release assets:"
            echo "$unexpected"
            exit 1
          fi
          ls -l dist
      - name: Write the checksums
        shell: bash
        run: |
          cd dist
          # One file for the whole release: a sidecar per asset multiplies the
          # asset list without adding anything.
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          # Immutable releases lock their assets and tag as soon as they are
          # published, so the release is drafted, filled, then published. An
          # existing draft from a failed run is filled and published the same
          # way; an already published release is left alone.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
              "${args[@]}" --draft
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,assets --jq '.url, (.assets[].name)'

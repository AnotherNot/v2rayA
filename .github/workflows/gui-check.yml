name: GUI Check

on:
  pull_request:
    paths:
      - "gui/**"
      - ".github/workflows/gui-check.yml"

concurrency:
  group: gui-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: gui/yarn.lock
      - run: yarn install --frozen-lockfile
      # Only runtime dependencies gate the build: the dev toolchain still
      # carries transitive advisories without a non-breaking fix (glob 11,
      # minimatch 10, deepmerge has no patched release at all).
      - run: yarn audit --groups dependencies --level high
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn i18n-check
      - run: yarn test
      - run: OUTPUT_DIR=dist yarn build
      # Reported only until the old component library leaves the bundle;
      # the gate value is set in the plan's last milestone.
      - run: node scripts/size-gate.mjs dist

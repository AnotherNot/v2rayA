name: Release to AUR (Reusable)

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

jobs:
  Release_to_AUR:
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Clone & Update AUR Repository
        env:
          VERSION: ${{ steps.prep.outputs.VERSION }}
        run: |
          mkdir -p aur
          git clone https://aur.archlinux.org/v2raya.git aur/v2raya
          git clone https://aur.archlinux.org/v2raya-bin.git aur/v2raya-bin
          rm -f aur/v2raya/.INSTALL aur/v2raya-bin/.INSTALL
          sed "s|The_Real_Version|$VERSION|g" install/aur/v2raya/PKGBUILD > aur/v2raya/PKGBUILD
          sed "s|The_Real_Version|$VERSION|g" install/aur/v2raya-bin/PKGBUILD > aur/v2raya-bin/PKGBUILD
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Init Arch Linux Container
        run: |
          podman pull docker.io/archlinux:latest
          podman run -d --rm --name archContainer -v "$PWD/aur:/aur" docker.io/archlinux:latest sleep infinity
          podman exec --user root:root archContainer pacman -Syu base-devel pacman-contrib --noconfirm
          podman exec --user root:root archContainer chown -R "$(id --user):$(id --user)" /aur
      - name: Update HASH
        run: |
          podman exec --user "$(id --user):$(id --user)" archContainer bash -c "cd /aur/v2raya-bin && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          podman exec --user "$(id --user):$(id --user)" archContainer bash -c "cd /aur/v2raya && makepkg --printsrcinfo > .SRCINFO"
      - name: Import OpenSSH Key
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [ -d ~/.ssh ] || mkdir ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The host key is committed: ssh-keyscan in the job would trust
          # whatever answers the connection instead of the known AUR host.
          install -m 644 .github/known_hosts/aur.archlinux.org ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOL
          Host aur.archlinux.org
            HostName aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOL
      - name: Commit & Push to AUR
        env:
          VERSION: ${{ steps.prep.outputs.VERSION }}
        run: |
          Current_Dir=$(pwd)
          sudo chown -R "$(id -u):$(id -u)" aur/v2raya
          sudo chown -R "$(id -u):$(id -u)" aur/v2raya-bin
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          cd "$Current_Dir/aur/v2raya" && git add -u && \
            git commit -m "Update to v$VERSION" && \
            git push --force ssh://aur@aur.archlinux.org/v2raya.git
          cd "$Current_Dir/aur/v2raya-bin" && git add -u && \
            git commit -m "Update to v$VERSION" && \
            git push --force ssh://aur@aur.archlinux.org/v2raya-bin.git
      - name: Clean Up
        run: |
          podman stop archContainer
